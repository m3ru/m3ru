<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Secret Santa Kiosk 🎅🎁</title>
  <style>
    :root{
      --bg1:#0b2a1f; --bg2:#0f3a2b; --bg3:#134a36;
      --gold:#f7d774; --red:#d94b4b; --green:#3ddc84; --snow:#f5fbff;
      --card:#0e2f24cc; --card2:#123a2dcc;
      --ring:#ffffff22;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }

    body{
      margin:0;
      min-height:100vh;
      color:var(--snow);
      background:
        radial-gradient(1200px 800px at 80% -10%, #1a5d45 0%, transparent 60%),
        radial-gradient(900px 600px at -10% 10%, #1b6b54 0%, transparent 55%),
        linear-gradient(180deg, var(--bg1), var(--bg2), var(--bg3));
      overflow-x:hidden;
      position:relative;
    }

    .snow {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(2px 2px at 10% 20%, #ffffffcc 50%, transparent 55%),
        radial-gradient(2px 2px at 30% 80%, #ffffffaa 50%, transparent 55%),
        radial-gradient(1.5px 1.5px at 70% 30%, #ffffffcc 50%, transparent 55%),
        radial-gradient(1.5px 1.5px at 85% 60%, #ffffffaa 50%, transparent 55%),
        radial-gradient(1px 1px at 50% 50%, #ffffffcc 50%, transparent 55%);
      animation: snow-drift 14s linear infinite;
      opacity:.7;
    }
    @keyframes snow-drift{
      0% { transform: translateY(-10vh); }
      100% { transform: translateY(110vh); }
    }

    header{
      text-align:center;
      padding: 32px 16px 12px;
    }
    header h1{
      margin:0 0 6px;
      font-size: clamp(26px, 4vw, 42px);
      letter-spacing: .5px;
      text-shadow: 0 2px 12px #00000066;
    }

    .wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: 12px 16px 60px;
      display:grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    .card{
      background: var(--card);
      border:1px solid var(--ring);
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 10px 30px #00000055;
      backdrop-filter: blur(6px);
    }

    .names-list{
      display:flex; flex-wrap:wrap; gap:8px; margin-top:8px;
    }

    .name-chip{
      padding:6px 10px; border-radius:999px;
      background:#ffffff10; border:1px dashed var(--ring);
      font-size:14px;
    }

    .reveal-box{
      text-align:center;
      padding: 18px;
      background: var(--card2);
      border-radius: 18px;
      border:1px solid var(--ring);
    }

    .reveal-result{
      margin-top: 14px;
      font-size: clamp(20px, 3.2vw, 30px);
      font-weight: 800;
      padding: 16px;
      border-radius: 14px;
      background: #0a221a;
      border: 2px solid #ffffff33;
      min-height: 64px;
      display:flex; align-items:center; justify-content:center;
    }

    button{
      appearance:none;
      border:none; border-radius: 999px;
      padding: 10px 14px; font-size:16px; font-weight:700; cursor:pointer;
      background: linear-gradient(180deg, #fff2b8, var(--gold));
    }

  </style>
</head>
<body>
  <div class="snow"></div>

  <header>
    <h1>🎅 Secret Santa Kiosk 🎁</h1>
  </header>

  <main class="wrap">

    <section id="setupScreen" class="card">
      <h2>🧑‍🎄 Setup</h2>
      <textarea id="namesInput" placeholder="Alice&#10;Bob&#10;Charlie"></textarea>
      <button id="parseBtn">Preview</button>
      <div id="namesPreview" class="names-list"></div>
      <button id="generateBtn">Generate</button>
      <button id="toRevealBtn" disabled>Go to Reveal</button>
      <div id="pairingBox" style="display:none;">
        <pre id="pairingList"></pre>
        <button id="hidePairsBtn">Hide</button>
      </div>
    </section>

    <section id="revealScreen" class="card" style="display:none;">
      <h2>🎁 Reveal</h2>
      <select id="personSelect"></select>
      <button id="revealBtn">Reveal</button>
      <button id="doneBtn" disabled>Done</button>
      <div id="result" class="reveal-result">Your match…</div>
      <button id="backToSetupBtn">Back</button>
    </section>

  </main>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const namesInput = $("namesInput");
  const namesPreview = $("namesPreview");
  const parseBtn = $("parseBtn");
  const generateBtn = $("generateBtn");
  const toRevealBtn = $("toRevealBtn");
  const pairingBox = $("pairingBox");
  const pairingList = $("pairingList");
  const hidePairsBtn = $("hidePairsBtn");
  const setupScreen = $("setupScreen");
  const revealScreen = $("revealScreen");
  const personSelect = $("personSelect");
  const revealBtn = $("revealBtn");
  const doneBtn = $("doneBtn");
  const result = $("result");
  const backToSetupBtn = $("backToSetupBtn");

  let names = [];
  let assignments = new Map();
  let revealed = new Set();

  function sanitizeNames(raw) {
    return raw.split("\n").map(s => s.trim()).filter(Boolean);
  }
  function shuffle(arr) {
    const a = arr.slice();
    for (let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
    return a;
  }
  function makeAssignments(list) {
    let rec = shuffle(list);
    const maxTries = 2000;
    let t=0;
    while (t++ < maxTries){
      rec = shuffle(list);
      if (list.every((g,i)=>g!==rec[i])){
         const m=new Map();
         list.forEach((g,i)=>m.set(g,rec[i]));
         return m;
      }
    }
    throw new Error("Failed to derange.");
  }

  parseBtn.onclick = () => {
    names = sanitizeNames(namesInput.value);
    namesPreview.innerHTML = "";
    names.forEach(n=>{
      const div=document.createElement("div");
      div.className="name-chip";
      div.textContent=n;
      namesPreview.appendChild(div);
    });
  };

  generateBtn.onclick = () => {
    names = sanitizeNames(namesInput.value);
    assignments = makeAssignments(names);
    revealed.clear();
    pairingList.textContent = [...assignments].map(([g,r])=>g+" → "+r).join("\n");
    pairingBox.style.display="block";
    toRevealBtn.disabled=false;
  };

  hidePairsBtn.onclick=()=>pairingBox.style.display="none";

  toRevealBtn.onclick=()=>{
    setupScreen.style.display="none";
    revealScreen.style.display="block";
    personSelect.innerHTML="";
    names.forEach(n=>{
      const o=document.createElement("option");
      o.value=n; o.textContent=n;
      personSelect.appendChild(o);
    });
    result.textContent="Your match…";
  };

  revealBtn.onclick=()=>{
    const g=personSelect.value;
    const r=assignments.get(g);
    result.textContent = r ? ("🎁 "+r) : "Error";
    doneBtn.disabled=false;
    revealBtn.disabled=true;
    revealed.add(g);
  };

  doneBtn.onclick=()=>{
    result.textContent="Your match…";
    doneBtn.disabled=true;
    revealBtn.disabled=false;
  };

  backToSetupBtn.onclick=()=>{
    revealScreen.style.display="none";
    setupScreen.style.display="block";
  };

})();
</script>
</body>
</html>
